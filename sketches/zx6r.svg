</g>
<g filter="url(#rough)" font-family="Georgia, serif" font-style="italic" fill="#efe6d6">
 <text x="720" y="400" font-size="48" font-weight="bold" transform="rotate(-8 720 400)">ZX-6R</text>
 <text x="650" y="545" font-size="26" fill="#d8d0c2">kawasaki</text>
</g>
<text x="70" y="110" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#4a3f38">Ninja ZX-6R</text>
<text x="72" y="145" font-family="Georgia, serif" font-size="18" letter-spacing="4" fill="#8a7a6c">MIDNIGHT EDITION — SKETCHBOOK</text>
</svg>
