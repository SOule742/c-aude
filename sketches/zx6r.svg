<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.3 0 0 0 0.10 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
 <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
 <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="21"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
 <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2a2422" stroke-width="1.6" opacity=".55"/></pattern>
</defs>
<rect width="1200" height="900" fill="#efe6d6"/>
<rect width="1200" height="900" fill="#fff" filter="url(#paper)"/>
<!-- background washes -->
<g filter="url(#rough2)" opacity=".75">
 <rect x="860" y="40" width="300" height="420" fill="#d9b38a"/>
 <rect x="1040" y="90" width="80" height="110" fill="#c9cfc9"/>
